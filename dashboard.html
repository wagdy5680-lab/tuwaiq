<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعية طويق لصناعة الكوادر البشرية - تقرير الشركات الشامل</title>
    <!-- خط Cairo العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --accent: #2dd4bf;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 25px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* الهيدر الفاخر */
        .header {
            background: linear-gradient(135deg, #0f766e, #134e4a);
            color: white;
            padding: 25px 35px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-icon {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            backdrop-filter: blur(5px);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-refresh {
            background: white;
            color: var(--primary);
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-family: 'Cairo', sans-serif;
        }

        .btn-refresh:hover {
            background: #f8fafc;
            transform: translateY(-2px);
        }

        /* بطاقات الإحصائيات السريعة (KPIs) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-icon.green { background: #ccfbf1; color: #0f766e; }
        .stat-icon.blue { background: #e0f2fe; color: #0284c7; }
        .stat-icon.purple { background: #f3e8ff; color: #9333ea; }

        .stat-info span {
            font-size: 0.82rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .stat-info h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 2px;
        }

        /* شريط البحث والفلترة */
        .toolbar {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 11px 18px 11px 45px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            font-family: 'Cairo', sans-serif;
            background: #f8fafc;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
        }

        .filter-status {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-sub);
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* حاوية جدول البيانات */
        .table-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 620px;
        }

        .table-responsive {
            flex: 1;
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
            font-size: 0.88rem;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: #f8fafc;
            color: var(--text-sub);
            font-weight: 700;
            padding: 15px 16px;
            text-align: right;
            border-bottom: 2px solid var(--border);
            border-left: 1px solid #f1f5f9;
        }

        td {
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
            border-left: 1px solid #f8fafc;
            color: var(--text-main);
        }

        tbody tr {
            transition: background 0.15s;
        }

        tbody tr:hover {
            background-color: #f0fdfa;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-resigned { background: #fee2e2; color: #991b1b; }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-sub);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- الهيدر الفاخر -->
    <div class="header">
        <div class="brand-section">
            <div class="brand-icon">
                <i class="fa-solid fa-building-shield"></i>
            </div>
            <div>
                <h1>جمعية طويق لصناعة الكوادر البشرية</h1>
                <p>لوحة متابعة وعرض تقرير (بحث_شامل_الشركات)</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-refresh" onclick="loadViewData()">
                <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> تحديث البيانات
            </button>
        </div>
    </div>

    <!-- بطاقات الإحصائيات -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon green"><i class="fa-solid fa-users"></i></div>
            <div class="stat-info">
                <span>إجمالي السجلات</span>
                <h3 id="totalRecords">0</h3>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon blue"><i class="fa-solid fa-money-bill-wave"></i></div>
            <div class="stat-info">
                <span>إجمالي الرواتب الكلية</span>
                <h3 id="totalSumSalary">0.00 ر.س</h3>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon purple"><i class="fa-solid fa-city"></i></div>
            <div class="stat-info">
                <span>عدد الشركات المدرجة</span>
                <h3 id="totalCompanies">0</h3>
            </div>
        </div>
    </div>

    <!-- شريط البحث الفوري -->
    <div class="toolbar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="بحث بالاسم، رقم السجل، أو اسم الشركة..." onkeyup="filterData()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="filter-status">
            <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
            <button class="filter-btn" onclick="setFilter('موظف', this)">الموظفون</button>
            <button class="filter-btn" onclick="setFilter('مستقيل', this)">المستقيلون</button>
        </div>
    </div>

    <!-- الجدول الاحترافي -->
    <div class="table-card">
        <div class="table-responsive">
            <table id="dataTable">
                <thead>
                    <tr id="tableHeaders">
                        <th>جاري تحميل الأعمدة...</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="100" class="empty-state">جاري الاتصال بقاعدة البيانات لجلب سجلات الفيو...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let globalData = [];
let currentFilter = 'all';

// جلب بيانات الفيو المخصص تلقائياً
async function loadViewData() {
    const refreshIcon = document.getElementById('refreshIcon');
    try {
        if (refreshIcon) refreshIcon.classList.add('fa-spin');

        // جلب البيانات حصرياً للفيو المطلوبة
        const response = await fetch('/api/get-data?name=بحث_شامل_الشركات');
        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.details || data.error || 'فشل جلب البيانات');
        }

        globalData = data;
        updateStatistics(data);
        renderTable(data);

    } catch (error) {
        console.error('خطأ:', error);
        alert('تفاصيل الخطأ: ' + error.message);
    } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
    }
}

// حساب وتحديث الإحصائيات العلوية
function updateStatistics(data) {
    document.getElementById('totalRecords').textContent = data.length.toLocaleString();

    let totalSalarySum = 0;
    const companiesSet = new Set();

    data.forEach(row => {
        // البحث عن أعمدة الراتب والشركة بمرونة
        const salaryKey = Object.keys(row).find(k => k.includes('الراتب') || k.includes('salary') || k.includes('إجمالي'));
        const companyKey = Object.keys(row).find(k => k.includes('الشركة') || k.includes('company'));

        if (salaryKey && !isNaN(parseFloat(row[salaryKey]))) {
            totalSalarySum += parseFloat(row[salaryKey]);
        }
        if (companyKey && row[companyKey]) {
            companiesSet.add(row[companyKey]);
        }
    });

    document.getElementById('totalSumSalary').textContent = totalSalarySum.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ر.س';
    document.getElementById('totalCompanies').textContent = companiesSet.size.toLocaleString();
}

// عرض ورسم الجدول
function renderTable(data) {
    const theadTr = document.getElementById('tableHeaders');
    const tbody = document.getElementById('tableBody');
    
    theadTr.innerHTML = '';
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
        theadTr.innerHTML = '<th>تنبيه</th>';
        tbody.innerHTML = '<tr><td colspan="100" class="empty-state">لا توجد بيانات مطابقة حالياً.</td></tr>';
        return;
    }

    const columns = Object.keys(data[0]);

    // إنشاء الترويسة
    columns.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        theadTr.appendChild(th);
    });

    // تعبئة الصفوف
    populateRows(data, columns);
}

function populateRows(data, columns) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="100" class="empty-state">لا توجد نتائج مطابقة للبحث أو الفلتر الحالي.</td></tr>';
        return;
    }

    data.forEach(row => {
        const tr = document.createElement('tr');
        columns.forEach(col => {
            const td = document.createElement('td');
            let val = row[col];

            // تنظيف عرض التواريخ لتكون مريحة
            if (typeof val === 'string' && val.includes('T') && val.includes('Z')) {
                val = val.split('T')[0];
            }

            // تنسيق الحالات الوظيفية بألوان مميزة
            if (col.includes('الحالة') && (val === 'موظف' || val === 'مستقيل')) {
                const span = document.createElement('span');
                span.className = `badge-status ${val === 'موظف' ? 'badge-active' : 'badge-resigned'}`;
                span.textContent = val;
                td.appendChild(span);
            } else {
                td.textContent = val !== null && val !== undefined ? val : '';
            }

            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

// تصفية البيانات (بحث فوري + فلتر الحالة)
function filterData() {
    const query = document.getElementById('searchInput').value.toLowerCase();

    const filtered = globalData.filter(row => {
        // مطابقة البحث النصي
        const matchesSearch = Object.values(row).some(val => 
            String(val).toLowerCase().includes(query)
        );

        // مطابقة فلتر الحالة الوظيفية إن وجد
        let matchesStatus = true;
        if (currentFilter !== 'all') {
            const statusVal = Object.values(row).find(val => String(val).trim() === currentFilter);
            matchesStatus = !!statusVal;
        }

        return matchesSearch && matchesStatus;
    });

    if (globalData.length > 0) {
        const columns = Object.keys(globalData[0]);
        populateRows(filtered, columns);
    }
}

function setFilter(status, btnElement) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
    filterData();
}

// التحميل التلقائي عند فتح الصفحة
document.addEventListener('DOMContentLoaded', () => {
    loadViewData();
});
</script>

</body>
</html>
