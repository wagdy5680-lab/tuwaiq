<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - جمعية طويق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 25px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            background: linear-gradient(135deg, #0f766e, #134e4a);
            color: white; padding: 25px 35px; border-radius: 16px;
            box-shadow: var(--shadow); display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }
        .brand-section { display: flex; align-items: center; gap: 15px; }
        .brand-icon {
            width: 55px; height: 55px; background: rgba(255, 255, 255, 0.15);
            border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px;
        }
        .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
        .header p { font-size: 0.9rem; opacity: 0.85; }
        .btn-action {
            background: white; color: var(--primary); border: none;
            padding: 10px 20px; border-radius: 10px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            text-decoration: none; font-family: 'Cairo', sans-serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-action:hover { background: #f8fafc; }
        
        /* شريط الأدوات والجدول */
        .toolbar {
            background: var(--card-bg); padding: 15px 25px; border-radius: 14px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        .search-box { position: relative; flex: 1; min-width: 280px; }
        .search-box input {
            width: 100%; padding: 11px 18px 11px 45px;
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 0.95rem; outline: none; font-family: 'Cairo', sans-serif;
            background: #f8fafc;
        }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }
        
        .table-card {
            background: var(--card-bg); border-radius: 16px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
            overflow: hidden; height: 580px; display: flex; flex-direction: column;
        }
        .table-responsive { flex: 1; overflow: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 0.88rem; }
        thead { position: sticky; top: 0; z-index: 10; }
        th { background: #f8fafc; color: var(--text-sub); font-weight: 700; padding: 15px 16px; text-align: right; border-bottom: 2px solid var(--border); }
        td { padding: 13px 16px; border-bottom: 1px solid var(--border); color: var(--text-main); }
        tbody tr:hover { background-color: #f0fdfa; }
        .empty-state { text-align: center; padding: 60px; color: var(--text-sub); font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر مع زر العودة للرئيسية -->
        <div class="header">
            <div class="brand-section">
                <div class="brand-icon">
                    <i class="fa-solid fa-building-shield"></i>
                </div>
                <div>
                    <h1>جمعية طويق لصناعة الكوادر البشرية</h1>
                    <p>لوحة متابعة تقرير الشركات الشامل</p>
                </div>
            </div>
            <div>
                <!-- رابط العودة لصفحة البوابة index.php -->
                <a href="index.php" class="btn-action">
                    <i class="fa-solid fa-house"></i> الرئيسية
                </a>
            </div>
        </div>

        <!-- شريط البحث -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="بحث سريع في السجلات..." onkeyup="filterData()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <!-- جدول البيانات -->
        <div class="table-card">
            <div class="table-responsive">
                <table id="dataTable">
                    <thead>
                        <tr id="tableHeaders">
                            <th>جاري التحميل...</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="100" class="empty-state">جاري جلب البيانات من السيرفر...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
let globalData = [];

// جلب البيانات عند تحميل الصفحة
window.addEventListener('DOMContentLoaded', () => {
    loadViewData();
});

async function loadViewData() {
    try {
        // يمكنك تغيير الEndpoint حسب مسار الـ API الخاص ببيانات الفيو لديك
        const response = await fetch('/api/get-data?name=بحث_شامل_الشركات');
        const data = await response.json();
        
        if (!response.ok) throw new Error(data.error || 'فشل الجلب');

        globalData = data;
        renderTable(data);
    } catch (error) {
        console.error('خطأ:', error);
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="100" class="empty-state" style="color:red;">خطأ في الاتصال: ${error.message}</td></tr>`;
    }
}

function renderTable(data) {
    const theadTr = document.getElementById('tableHeaders');
    const tbody = document.getElementById('tableBody');
    
    theadTr.innerHTML = '';
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
        theadTr.innerHTML = '<th>تنبيه</th>';
        tbody.innerHTML = '<tr><td colspan="100" class="empty-state">لا توجد بيانات متاحة.</td></tr>';
        return;
    }

    const columns = Object.keys(data[0]);
    columns.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        theadTr.appendChild(th);
    });

    populateRows(data, columns);
}

function populateRows(data, columns) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="100" class="empty-state">لا توجد نتائج مطابقة.</td></tr>';
        return;
    }

    data.forEach(row => {
        const tr = document.createElement('tr');
        columns.forEach(col => {
            const td = document.createElement('td');
            td.textContent = row[col] !== null && row[col] !== undefined ? row[col] : '';
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

function filterData() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = globalData.filter(row => 
        Object.values(row).some(val => String(val).toLowerCase().includes(query))
    );
    if (globalData.length > 0) {
        populateRows(filtered, Object.keys(globalData[0]));
    }
}
</script>

</body>
</html>
