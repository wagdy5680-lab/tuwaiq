<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعية طويق لصناعة الكوادر البشرية - البوابة الرئيسية</title>
    <!-- خط Cairo العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --accent: #2dd4bf;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .welcome-card {
            background: var(--card-bg);
            max-width: 550px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .brand-icon-large {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0f766e, #134e4a);
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto;
            box-shadow: 0 10px 20px rgba(15, 118, 110, 0.2);
        }

        .welcome-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .welcome-header p {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
        }

        .features-list {
            display: flex;
            justify-content: space-around;
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .feature-item i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .btn-dashboard {
            background: linear-gradient(135deg, #0f766e, #134e4a);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
            font-family: 'Cairo', sans-serif;
        }

        .btn-dashboard:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(15, 118, 110, 0.35);
            background: linear-gradient(135deg, #115e59, #0f766e);
        }

        .footer-note {
            font-size: 0.8rem;
            color: var(--text-sub);
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="brand-icon-large">
            <i class="fa-solid fa-building-shield"></i>
        </div>
        
        <div class="welcome-header">
            <h1>جمعية طويق لصناعة الكوادر البشرية</h1>
            <p>نظام متابعة تقارير الشركات الشامل وإدارة البيانات الوظيفية بكفاءة عالية</p>
        </div>

        <div class="features-list">
            <div class="feature-item">
                <i class="fa-solid fa-database"></i>
                <span>قواعد البيانات</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-chart-pie"></i>
                <span>إحصائيات فورية</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-bolt"></i>
                <span>بحث سريع</span>
            </div>
        </div>

        <!-- زر الانتقال للوحة التحكم (Dashboard) مع الأيقونة المطلوبة -->
        <a href="dashboard.html" class="btn-dashboard">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span>الانتقال إلى لوحة التحكم (Dashboard)</span>
        </a>

        <div class="footer-note">
            جميع الحقوق محفوظة © جمعية طويق لصناعة الكوادر البشرية 2026
        </div>
    </div>

</body>
</html>
