<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعية طويق لصناعة الكوادر البشرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #008080;
            --primary-hover: #005f5f;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .record-count {
            font-weight: bold;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .btn-refresh {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s ease;
        }

        .btn-refresh:hover {
            background-color: var(--primary-hover);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
            font-size: 0.88rem;
        }

        th, td {
            padding: 12px 10px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr:hover {
            background-color: #f1f8f8;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>عرض بيانات الشركات (Aiven PostgreSQL)</h1>
        <div class="controls">
            <span class="record-count" id="recordCount">&#128196; جاري التحميل...</span>
            <button class="btn-refresh" onclick="fetchDataFromAiven()">
                <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> تحديث من Aiven
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>الاسم رباعياً</th>
                    <th>تاريخ البداء</th>
                    <th>الراتب الشهري</th>
                    <th>الحالة الوظيفية</th>
                    <th>عدد الأيام</th>
                    <th>إجمالي الراتب حتى اليوم</th>
                    <th>تاريخ النهاية</th>
                    <th>اسم الشركة</th>
                    <th>رقم السجل المدني</th>
                    <th>الجهه المكلف به حالياً</th>
                    <th>الحالة الانسانية</th>
                    <th>ملاحظة جهة الاحالة</th>
                    <th>وسيلة الاتصال (جوال)</th>
                    <th>المؤهل العلمي</th>
                    <th>الوظيفة</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<script>
async function fetchDataFromAiven() {
    const refreshIcon = document.getElementById('refreshIcon');
    try {
        if (refreshIcon) refreshIcon.classList.add('fa-spin');

        const response = await fetch('/api/get-data');
        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.details || data.error || 'فشل جلب البيانات من السيرفر');
        }

        renderTableData(data);

        const countSpan = document.getElementById('recordCount');
        if (countSpan) countSpan.innerHTML = `&#128196; إجمالي السجلات: ${data.length}`;

    } catch (error) {
        console.error('خطأ أثناء التحديث:', error);
        alert('تفاصيل الخطأ: ' + error.message);
    } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
    }
}

function renderTableData(data) {
    const tbody = document.querySelector('#dataTable tbody');
    if (!tbody) return;
    tbody.innerHTML = '';

    data.forEach(row => {
        const keys = Object.keys(row);
        
        const val = (...possibleKeys) => {
            for (let k of possibleKeys) {
                if (row[k] !== undefined && row[k] !== null) return row[k];
            }
            return '';
        };

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="col-idx-0" data-label="الاسم رباعياً">${val('الاسم رباعياً', 'full_name', keys[0])}</td>
            <td class="col-idx-1" data-label="تاريخ البداء">${val('تاريخ البداء', 'start_date', keys[1])}</td>
            <td class="col-idx-2" data-label="الراتب الشهري">${val('الراتب الشهري', 'monthly_salary', keys[2])}</td>
            <td class="col-idx-3" data-label="الحالة الوظيفية">${val('الحالة الوظيفية', 'job_status', keys[3])}</td>
            <td class="col-idx-4" data-label="عدد الأيام">${val('عدد الأيام', 'days_count', keys[4])}</td>
            <td class="col-idx-5" data-label="إجمالي الراتب حتى اليوم">${val('إجمالي الراتب حتى اليوم', 'total_salary', keys[5])}</td>
            <td class="col-idx-6" data-label="تاريخ النهاية">${val('تاريخ النهاية', 'end_date', keys[6])}</td>
            <td class="col-idx-7" data-label="اسم الشركة">${val('اسم الشركة', 'company_name', keys[7])}</td>
            <td class="col-idx-8" data-label="رقم السجل المدني">${val('رقم السجل المدني', 'national_id', keys[8])}</td>
            <td class="col-idx-9" data-label="الجهه المكلف به حالياً">${val('الجهه المكلف به حالياً', 'assigned_to', keys[9])}</td>
            <td class="col-idx-10" data-label="الحالة الانسانية">${val('الحالة الانسانية', 'humanitarian_status', keys[10])}</td>
            <td class="col-idx-11" data-label="ملاحظة جهة الاحالة">${val('ملاحظة جهة الاحالة', 'referral_notes', keys[11])}</td>
            <td class="col-idx-12" data-label="وسيلة الاتصال (جوال)">${val('وسيلة الاتصال (جوال)', 'phone', keys[12])}</td>
            <td class="col-idx-13" data-label="المؤهل العلمي">${val('المؤهل العلمي', 'education', keys[13])}</td>
            <td class="col-idx-14" data-label="الوظيفة">${val('الوظيفة', 'job_title', keys[14])}</td>
        `;
        tbody.appendChild(tr);
    });
}

document.addEventListener('DOMContentLoaded', () => {
    fetchDataFromAiven();
});
</script>

</body>
</html>
