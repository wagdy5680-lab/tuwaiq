<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعية طويق لصناعة الكوادر البشرية - البوابة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #0b534d;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --transition: all 0.25s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .welcome-card {
            background: var(--card-bg);
            max-width: 550px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .brand-icon-large {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #0f766e, #134e4a);
            color: white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; margin: 0 auto;
        }
        .welcome-header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
        .welcome-header p { font-size: 0.95rem; color: var(--text-sub); }
        
        .btn-dashboard {
            background: linear-gradient(135deg, #0f766e, #134e4a);
            color: white; border: none; padding: 14px 25px;
            border-radius: 12px; font-size: 1.05rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 12px; text-decoration: none;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            width: 100%;
        }
        .btn-dashboard:hover { transform: translateY(-2px); background: linear-gradient(135deg, #0b534d, #0f766e); }

        /* نافذة إدخال الرقم السري المحمية */
        .password-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            animation: fadeIn 0.3s ease;
        }

        .password-modal.show {
            display: flex;
        }

        .password-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .password-box h3 {
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .password-box p {
            font-size: 0.88rem;
            color: var(--text-sub);
        }

        .password-input-group input[type="password"] {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
            font-family: 'Cairo', sans-serif;
            text-align: center;
            letter-spacing: 3px;
            transition: var(--transition);
        }

        .password-input-group input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.15);
        }

        .password-actions {
            display: flex;
            gap: 10px;
        }

        .password-actions button {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition);
            border: none;
        }

        .btn-confirm-pwd {
            background: var(--primary);
            color: white;
        }
        .btn-confirm-pwd:hover {
            background: var(--primary-dark);
        }

        .btn-cancel-pwd {
            background: #f1f5f9;
            color: var(--text-sub);
        }
        .btn-cancel-pwd:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .footer-note { font-size: 0.8rem; color: var(--text-sub); opacity: 0.8; }
    </style>
</head>
<body>

    <!-- نافذة إدخال الرقم السري (تظهر نجوم *** عند الكتابة) -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h3><i class="fa-solid fa-lock"></i> إدخال الرقم السري</h3>
            <p>يرجى إدخال الرقم السري للانتقال إلى لوحة التحكم:</p>
            <div class="password-input-group">
                <input type="password" id="secretInput" placeholder="••••" onkeydown="checkEnter(event)">
            </div>
            <div class="password-actions">
                <button class="btn-confirm-pwd" onclick="verifyPassword()">تأكيد</button>
                <button class="btn-cancel-pwd" onclick="closePasswordModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="welcome-card">
        <div class="brand-icon-large">
            <i class="fa-solid fa-building-shield"></i>
        </div>
        
        <div class="welcome-header">
            <h1>جمعية طويق لصناعة الكوادر البشرية</h1>
            <p>نظام إدارة البيانات والتقارير الشاملة</p>
        </div>

        <!-- زر الانتقال يحمى بكلمة المرور -->
        <button class="btn-dashboard" onclick="openPasswordModal()">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span>الانتقال إلى لوحة التحكم (Dashboard)</span>
        </button>

        <div class="footer-note">
            جميع الحقوق محفوظة © 2026
        </div>
    </div>

    <script>
        // الرقم السري مشفر بـ Base64 (القيمة الحالية تعادل الرقم: 1234)
        const ENCRYPTED_SECRET = "MTIzNA==";

        function openPasswordModal() {
            const modal = document.getElementById('passwordModal');
            modal.classList.add('show');
            const input = document.getElementById('secretInput');
            input.value = '';
            input.focus();
        }

        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            modal.classList.remove('show');
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                verifyPassword();
            }
        }

        function verifyPassword() {
            const enteredValue = document.getElementById('secretInput').value;
            
            try {
                const decodedSecret = atob(ENCRYPTED_SECRET);
                if (enteredValue === decodedSecret) {
                    // إذا كان الرقم صحيحاً، ينتقل إلى صفحة لوحة التحكم مباشرة
                    window.location.href = 'dashboard.html';
                } else {
                    alert('الرقم السري غير صحيح!');
                    document.getElementById('secretInput').value = '';
                    document.getElementById('secretInput').focus();
                }
            } catch (e) {
                alert('خطأ في التحقق من الأمان');
            }
        }
    </script>

</body>
</html>
