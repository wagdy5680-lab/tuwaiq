<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعية طويق لصناعة الكوادر البشرية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #008080;
            --primary-hover: #005f5f;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .record-count {
            font-weight: bold;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        select, .btn-refresh {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            outline: none;
        }

        select {
            background-color: white;
            cursor: pointer;
        }

        .btn-refresh {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s ease;
        }

        .btn-refresh:hover {
            background-color: var(--primary-hover);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
            font-size: 0.88rem;
        }

        th, td {
            padding: 12px 10px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr:hover {
            background-color: #f1f8f8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>عرض بيانات قاعدة البيانات (Aiven PostgreSQL)</h1>
        <div class="controls">
            <!-- قائمة منسدلة لاختيار الجدول أو الـ View -->
            <select id="tableSelect" onchange="fetchDataFromAiven()">
                <option value="">-- اختر الجدول أو الـ View --</option>
            </select>
            <span class="record-count" id="recordCount">&#128196; اختر جدولاً...</span>
            <button class="btn-refresh" onclick="fetchDataFromAiven()">
                <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> تحديث
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table id="dataTable">
            <thead>
                <tr id="tableHeaders">
                    <th>البيانات ستظهر هنا...</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>
</div>

<script>
// جلب قائمة الجداول والفيوز عند تحميل الصفحة وتعبئتها في القائمة المنسدلة
async function loadTablesList() {
    try {
        const response = await fetch('/api/tables');
        const tables = await response.json();
        
        const select = document.getElementById('tableSelect');
        select.innerHTML = '<option value="">-- اختر الجدول أو الـ View --</option>';
        
        tables.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.table_name;
            opt.textContent = `${t.table_name} (${t.table_type})`;
            // تحديد الـ View الخاص بك افتراضياً إن وجد
            if (t.table_name.includes('بحث_شامل_الشركات')) {
                opt.selected = true;
            }
            select.appendChild(opt);
        });

        // إذا تم اختيار شيء افتراضياً، جلب بياناته
        if (select.value) {
            fetchDataFromAiven();
        }
    } catch (err) {
        console.error('خطأ في جلب قائمة الجداول:', err);
    }
}

// جلب بيانات الجدول أو الـ View المختار
async function fetchDataFromAiven() {
    const select = document.getElementById('tableSelect');
    const tableName = select.value;
    if (!tableName) return;

    const refreshIcon = document.getElementById('refreshIcon');
    try {
        if (refreshIcon) refreshIcon.classList.add('fa-spin');

        const response = await fetch(`/api/get-data?name=${encodeURIComponent(tableName)}`);
        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.details || data.error || 'فشل جلب البيانات');
        }

        renderDynamicTable(data);

        const countSpan = document.getElementById('recordCount');
        if (countSpan) countSpan.innerHTML = `&#128196; إجمالي السجلات: ${data.length}`;

    } catch (error) {
        console.error('خطأ أثناء التحديث:', error);
        alert('تفاصيل الخطأ: ' + error.message);
    } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
    }
}

// رسم الجدول مرناً حسب أعمدة الجدول المختار
function renderDynamicTable(data) {
    const theadTr = document.getElementById('tableHeaders');
    const tbody = document.getElementById('tableBody');
    
    theadTr.innerHTML = '';
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
        theadTr.innerHTML = '<th>لا توجد بيانات في هذا الجدول</th>';
        return;
    }

    const columns = Object.keys(data[0]);

    // إنشاء ترويسة الأعمدة
    columns.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        theadTr.appendChild(th);
    });

    // إنشاء الصفوف
    data.forEach(row => {
        const tr = document.createElement('tr');
        columns.forEach(col => {
            const td = document.createElement('td');
            td.textContent = row[col] !== null && row[col] !== undefined ? row[col] : '';
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

// تحميل القائمة تلقائياً عند فتح الصفحة
document.addEventListener('DOMContentLoaded', () => {
    loadTablesList();
});
</script>

</body>
</html>
