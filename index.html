<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعية طويق لصناعة الكوادر البشرية - البوابة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #0b534d;
            --primary-light: #14b8a6;
            --bg-main: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: rgba(226, 232, 240, 0.8);
            --shadow: 0 20px 40px -15px rgba(15, 118, 110, 0.08), 0 0 15px rgba(0, 0, 0, 0.02);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-main);
            /* إضافة نمط خلفية شبكي هندسي خفيف وجميل */
            background-image: 
                radial-gradient(at 0% 0%, rgba(15, 118, 110, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.05) 0px, transparent 50%),
                linear-gradient(to right, rgba(226, 232, 240, 0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 240, 0.4) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .welcome-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            max-width: 520px;
            width: 100%;
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 30px;
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* خط جمالي علوي متدرج للبطاقة */
        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #0f766e, #14b8a6, #0b534d);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brand-icon-large {
            width: 85px; 
            height: 85px;
            background: linear-gradient(135deg, #0f766e, #115e59);
            color: white; 
            border-radius: 22px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 38px; 
            margin: 0 auto;
            box-shadow: 0 12px 25px -8px rgba(15, 118, 110, 0.4);
            position: relative;
            transition: var(--transition);
        }

        .brand-icon-large:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .welcome-header h1 { 
            font-size: 1.65rem; 
            font-weight: 800; 
            color: var(--text-main);
            margin-bottom: 10px; 
            letter-spacing: -0.5px;
        }

        .welcome-header p { 
            font-size: 0.98rem; 
            color: var(--text-sub); 
            font-weight: 600;
        }
        
        .btn-dashboard {
            background: linear-gradient(135deg, #0f766e, #115e59);
            color: white; 
            border: none; 
            padding: 16px 25px;
            border-radius: 14px; 
            font-size: 1.05rem; 
            font-weight: 700;
            cursor: pointer; 
            display: flex; 
            align-items: center;
            justify-content: center; 
            gap: 12px; 
            text-decoration: none;
            box-shadow: 0 8px 20px -4px rgba(15, 118, 110, 0.3);
            transition: var(--transition);
            font-family: 'Cairo', sans-serif;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn-dashboard::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: var(--transition);
        }

        .btn-dashboard:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 25px -4px rgba(15, 118, 110, 0.45);
            background: linear-gradient(135deg, #0d655e, #0f766e); 
        }

        .btn-dashboard:active {
            transform: translateY(-1px);
        }

        /* نافذة إدخال الرقم السري المحمية */
        .password-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            animation: fadeIn 0.3s ease;
            padding: 20px;
        }

        .password-modal.show {
            display: flex;
        }

        .password-box {
            background: white;
            padding: 35px 30px;
            border-radius: 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            border: 1px solid var(--border);
            animation: modalScale 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .password-box h3 {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .password-box p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .password-input-group input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.2rem;
            outline: none;
            font-family: 'Cairo', sans-serif;
            text-align: center;
            letter-spacing: 5px;
            transition: var(--transition);
            background: #f8fafc;
        }

        .password-input-group input[type="password"]:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
        }

        .password-actions {
            display: flex;
            gap: 12px;
        }

        .password-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition);
            border: none;
        }

        .btn-confirm-pwd {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
        }
        .btn-confirm-pwd:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-cancel-pwd {
            background: #f1f5f9;
            color: var(--text-sub);
        }
        .btn-cancel-pwd:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .footer-note { 
            font-size: 0.82rem; 
            color: var(--text-sub); 
            opacity: 0.85;
            border-top: 1px dashed var(--border);
            padding-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- نافذة إدخال الرقم السري -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h3><i class="fa-solid fa-lock"></i> إدخال الرقم السري</h3>
            <p>يرجى إدخال الرقم السري للانتقال إلى لوحة التحكم:</p>
            <div class="password-input-group">
                <input type="password" id="secretInput" placeholder="••••" onkeydown="checkEnter(event)">
            </div>
            <div class="password-actions">
                <button class="btn-confirm-pwd" onclick="verifyPassword()">تأكيد</button>
                <button class="btn-cancel-pwd" onclick="closePasswordModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="welcome-card">
        <div class="brand-icon-large">
            <i class="fa-solid fa-building-shield"></i>
        </div>
        
        <div class="welcome-header">
            <h1>جمعية طويق لصناعة الكوادر البشرية</h1>
            <p>نظام إدارة البيانات والتقارير الشاملة</p>
        </div>

        <!-- زر الانتقال يحمى بكلمة المرور -->
        <button class="btn-dashboard" onclick="openPasswordModal()">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span>الانتقال إلى لوحة التحكم (Dashboard)</span>
        </button>

        <div class="footer-note">
            جميع الحقوق محفوظة © 2026
        </div>
    </div>

    <script>
        const ENCRYPTED_SECRET = "d3cxMjN3dw==";

        function openPasswordModal() {
            const modal = document.getElementById('passwordModal');
            modal.classList.add('show');
            const input = document.getElementById('secretInput');
            input.value = '';
            input.focus();
        }

        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            modal.classList.remove('show');
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                verifyPassword();
            }
        }

        function verifyPassword() {
            const enteredValue = document.getElementById('secretInput').value;
            
            try {
                const decodedSecret = atob(ENCRYPTED_SECRET);
                if (enteredValue === decodedSecret) {
                    window.location.href = 'dashboard.html';
                } else {
                    alert('الرقم السري غير صحيح!');
                    document.getElementById('secretInput').value = '';
                    document.getElementById('secretInput').focus();
                }
            } catch (e) {
                alert('خطأ في التحقق من الأمان');
            }
        }
    </script>

</body>
</html>
